<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Зачем: модуль отложен, и без этого тёмная тема вспыхивает после первой отрисовки. В хранилище ничего не пишем.
      try {
        const storedTheme = localStorage.getItem('zaloghub-theme')

        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme
        }
      } catch {
        // Чтение запрещено. Тема останется светлой, хранилище не трогаем.
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Мои задачи</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?hold=3"></script>
  </body>
</html>
